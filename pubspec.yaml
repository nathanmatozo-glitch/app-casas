name: app_casas
description: Aplicativo Flutter para divulgação e gerenciamento de imóveis.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  google_sign_in: ^7.2.0
  cloud_firestore: ^7.1.0
  firebase_storage: ^14.0.1
  image_picker: ^1.2.4
  geolocator: ^14.1.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
